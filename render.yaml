# Render blueprint (10.5). Frankfurt: the nearest region to Sudan; a region cannot change later.
#
# TEST DEPLOY ONLY: every plan is `free`, chosen by the owner to prove the client-IP header on a
# live service (progress.md, 10.5). Free services sleep after 15 minutes (the jobs stop), the free
# database expires after 30 days and has no backups, and a free service has no pre-deploy command.
# Before real users, follow "Production" at the bottom.
#
# Migrations never run on boot (A3). Without a pre-deploy command, run them from a machine:
#   cd api && DATABASE_URL=<external URL of sayaratak-db> bun run db:migrate
# (only DATABASE_URL: with MIGRATE_DATABASE_URL set too, the two must be different users)
services:
  - type: web
    name: sayaratak-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /api/health/ready
    buildFilter:
      paths:
        - api/**
        - packages/shared/**
        - bun.lock
    envVars:
      # development: service keys stay blank. Production requires COOKIE_DOMAIN, GOOGLE_*, CLOUDINARY_URL,
      # SMTP_*, MAIL_FROM, R2_*, FCM_SERVICE_ACCOUNT; FACEBOOK_* and APPLE_* stay optional all-or-none groups.
      - key: APP_ENV
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: sayaratak-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Public authentication belongs to the website proxy, not the direct API address.
      - key: BETTER_AUTH_URL
        value: https://sayaratak-web.onrender.com
      - key: WEB_ORIGIN
        value: https://sayaratak-web.onrender.com
      - key: CLIENT_IP_MODE
        value: render
      - key: API_PUBLIC_ORIGIN
        value: https://sayaratak-api-91a8.onrender.com
      # Same dedicated server-only key on BOTH services; never generate independent keys here.
      - key: PROXY_CLIENT_IP_SECRET
        sync: false
      # Keep blank in Render mode; regional outbound ranges do not identify this website.
      - key: TRUSTED_PROXIES
        sync: false
      # Service keys (A14). Optional while APP_ENV=development (blank = feature off). When APP_ENV=production,
      # COOKIE_DOMAIN, GOOGLE_*, CLOUDINARY_URL, SMTP_*, MAIL_FROM, R2_*, FCM_SERVICE_ACCOUNT are required;
      # FACEBOOK_* (pair) and APPLE_* (5 keys) are each all-or-none optional. sync: false keeps values out of git.
      # Keep absent/blank for these Render hostnames. Never set onrender.com.
      - key: COOKIE_DOMAIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: APPLE_APP_BUNDLE_ID
        sync: false
      # Platform admin endpoint (8.12): off while either is blank.
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: ADMIN_RECOVERY_EMAIL
        sync: false

  - type: web
    name: sayaratak-web
    runtime: node
    region: frankfurt
    plan: free
    buildFilter:
      paths:
        - web/**
        - packages/shared/**
        - bun.lock
    buildCommand: bun install --frozen-lockfile && bun run --cwd web build
    startCommand: bun run --cwd web start
    envVars:
      - key: BUN_VERSION
        value: 1.4.2
      # SSR/proxy uses the API; browsers use the website. Rebuild after VITE changes.
      - key: API_BASE_URL
        value: https://sayaratak-api-91a8.onrender.com
      - key: VITE_API_BASE_URL
        value: https://sayaratak-web.onrender.com
      - key: APP_ORIGIN
        value: https://sayaratak-web.onrender.com
      - key: CLIENT_IP_MODE
        value: render
      - key: PROXY_CLIENT_IP_SECRET
        sync: false
      - key: IMAGE_ORIGINS
        value: https://res.cloudinary.com
      - key: VITE_DEMO
        value: "false"
      - key: VITE_FEATURE_OTP
        value: "false"
      - key: VITE_FEATURE_FACEBOOK
        value: "false"

databases:
  - name: sayaratak-db
    databaseName: sayaratak
    user: sayaratak
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"

# Production (paid plans, custom domains from T4):
#   1. plan: on both services and the database to a paid size (ids in Render's blueprint spec), not `free`.
#   2. API service: preDeployCommand: bun run db:migrate
#   3. API service env: MIGRATE_DATABASE_URL from the database's connectionString (fromDatabase),
#      DATABASE_URL by hand (sync: false) as postgres://sayaratak_app:<password>@<internal host>/sayaratak,
#      so db:migrate creates the limited app user (src/shared/db/app-role.ts).
#   4. API service env, all sync: false: APP_ENV=production plus required service keys (COOKIE_DOMAIN,
#      GOOGLE_*, CLOUDINARY_URL, SMTP_*, MAIL_FROM, R2_*, FCM_SERVICE_ACCOUNT); optional all-or-none
#      groups FACEBOOK_* (set VITE_FEATURE_FACEBOOK="true" on sayaratak-web when enabled) and APPLE_*;
#      ADMIN_SECRET_KEY and ADMIN_RECOVERY_EMAIL (sync: false does not work inside an env group).
#   5. domains: for api and web once T4 gives the hostnames.
