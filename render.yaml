# Render blueprint (10.5). Frankfurt: the nearest region to Sudan; a region cannot change later.
#
# TEST DEPLOY ONLY: every plan is `free`, chosen by the owner to prove the client-IP header on a
# live service (progress.md, 10.5). Free services sleep after 15 minutes (the jobs stop), the free
# database expires after 30 days and has no backups, and a free service has no pre-deploy command.
# Before real users, follow "Production" at the bottom.
#
# Migrations never run on boot (A3). Without a pre-deploy command, run them from a machine:
#   cd api && DATABASE_URL=<external URL of sayaratak-db> bun run db:migrate
# (only DATABASE_URL: with MIGRATE_DATABASE_URL set too, the two must be different users)
services:
  - type: web
    name: sayaratak-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /api/health/live
    buildFilter:
      paths:
        - api/**
        - packages/shared/**
        - bun.lock
    envVars:
      # development: the service keys (Google, Cloudinary, SMTP, R2, ...) stay blank. Production needs all.
      - key: APP_ENV
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: sayaratak-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # This service's public address, and the web app's origin.
      - key: BETTER_AUTH_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # Blank until the two-network check proves which addresses Render's proxy uses (A3, T7).
      - key: TRUSTED_PROXIES
        sync: false

  - type: web
    name: sayaratak-web
    runtime: node
    region: frankfurt
    plan: free
    buildFilter:
      paths:
        - web/**
        - packages/shared/**
        - bun.lock
    buildCommand: bun install --frozen-lockfile && bun run --cwd web build
    startCommand: bun run --cwd web start
    envVars:
      - key: BUN_VERSION
        value: 1.4.2
      # 11.3 adds API_BASE_URL and VITE_API_BASE_URL; until then the web app answers from its mock.

databases:
  - name: sayaratak-db
    databaseName: sayaratak
    user: sayaratak
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"

# Production (paid plans, custom domains from T4):
#   1. plan: on both services and the database to a paid size (ids in Render's blueprint spec), not `free`.
#   2. API service: preDeployCommand: bun run db:migrate
#   3. API service env: MIGRATE_DATABASE_URL from the database's connectionString (fromDatabase),
#      DATABASE_URL by hand (sync: false) as postgres://sayaratak_app:<password>@<internal host>/sayaratak,
#      so db:migrate creates the limited app user (src/shared/db/app-role.ts).
#   4. API service env, all sync: false: APP_ENV=production plus COOKIE_DOMAIN, GOOGLE_*, FACEBOOK_*,
#      CLOUDINARY_URL, SMTP_*, MAIL_FROM, R2_*, FCM_SERVICE_ACCOUNT, APPLE_*, ADMIN_SECRET_KEY,
#      ADMIN_RECOVERY_EMAIL (sync: false does not work inside an env group, so they stay here).
#   5. domains: for api and web once T4 gives the hostnames.
