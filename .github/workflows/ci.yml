name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No .env in CI. Test-only values, not secrets; tests/setup.ts points
    # DATABASE_URL at TEST_DATABASE_URL and migrates it.
    env:
      NODE_ENV: test
      APP_ENV: test
      TEST_DATABASE_URL: postgres://sayaratak:sayaratak@localhost:5434/sayaratak
      WEB_ORIGIN: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:4000
      # The runner's pg_dump is not version 18; the service image has it (8.11).
      PG_CLIENT_CMD: docker run --rm -i --network host postgres:18.3-alpine3.23
    services:
      # Same image and port as the postgres-test service in api/docker-compose.yml.
      postgres:
        image: postgres:18.3-alpine3.23
        env:
          POSTGRES_USER: sayaratak
          POSTGRES_PASSWORD: sayaratak
          POSTGRES_DB: sayaratak
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U sayaratak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install pinned oasdiff
        env:
          OASDIFF_VERSION: 1.35.0
          OASDIFF_SHA256: a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140
        run: |
          tool_dir="$RUNNER_TEMP/oasdiff"
          mkdir -p "$tool_dir"
          archive="$tool_dir/oasdiff.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "$OASDIFF_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$tool_dir" oasdiff
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Check API compatibility
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=refs/remotes/origin/main
          if [[ "$EVENT_NAME" == pull_request && "$PR_BASE_REF" == main ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == push && "$REF" == refs/heads/main && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            base="$PUSH_BEFORE"
          fi
          git show "${base}:api/openapi.json" > "$RUNNER_TEMP/openapi-base.json"
          bun api/scripts/check-api-contract.ts "$RUNNER_TEMP/openapi-base.json" api/openapi.json
      - name: Prove contract guard rejects breaking changes
        run: bun api/scripts/contract-smoke.ts
      - run: bun install --frozen-lockfile
      # Ignored, dev tools only (never in a production bundle or the api):
      # seroval 1.5.6 inside solid-js inside @tanstack/devtools (the dev panel),
      # zod 3 inside the shadcn CLI. Fixing them re-resolves the whole lockfile;
      # drop these ids when devtools and shadcn are next upgraded.
      - run: >-
          bun audit --audit-level=high
          --ignore=GHSA-p6vx-979v-rg4c --ignore=GHSA-jp82-f5mq-hwhp
          --ignore=GHSA-97r2-qh9m-474h --ignore=GHSA-wp97-x4hv-qvhp
          --ignore=GHSA-7rv5-mrxv-xcr9 --ignore=GHSA-9wx9-5pv9-3349
          --ignore=GHSA-mrhx-c7xc-m3w5
      - working-directory: packages/shared
        run: bun run lint && bun run check
      - working-directory: api
        run: bun run typecheck
      - working-directory: api
        run: bun run lint
      - working-directory: api
        run: bun run check
      - name: Check OpenAPI freshness
        working-directory: api
        run: bun run test tests/openapi.test.ts
      - working-directory: api
        run: bun run test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run size
